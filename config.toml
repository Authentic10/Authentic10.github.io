baseURL = 'https://atchagnaou.me/'
defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false
title = 'Ahmed Tchagnaou'
theme = "hugo-noir"
enableRobotsTXT = true

[module]
  [[module.mounts]]
    source = "content/fr"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["fr"]
  [[module.mounts]]
    source = "content/en"
    target = "content"
    [module.mounts.sites.matrix]
      languages = ["en"]

[build]
  [build.buildStats]
    enable = true

# Taxonomy configuration
[taxonomies]
  category = "categories"
  tag = "tags"


[params]
name = "Ahmed Tchagnaou"
location = "France"
description = "Ingénieur Data & IA · Data Engineering · IA générative"
profile_image = "/images/profile.jpg"
github = "https://github.com/Authentic10"
github_username = "Authentic10"
email = "ahmed@atchagnaou.me"
linkedin = "https://www.linkedin.com/in/atchagnaou/"
linkedin_username = "atchagnaou"
images = ["/images/og.png"]
# Analytics sans cookie (https://www.goatcounter.com) : renseigner le code du compte
# goatcounter = "atchagnaou"



[languages]
  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    title = "Ahmed Tchagnaou"
    weight = 1
    [languages.fr.params]
      description = "Ingénieur Data & IA : près de 5 ans de data engineering en production (Spark, Scala, data lake) et IA générative (RAG évalués, agents LLM, API conteneurisées)."
    [languages.fr.menu]
      [[languages.fr.menu.main]]
        name = "À propos"
        pageRef = "/about"
        weight = 1
      [[languages.fr.menu.main]]
        name = "Expérience"
        pageRef = "/experience"
        weight = 2
      [[languages.fr.menu.main]]
        name = "Projets"
        pageRef = "/projects"
        weight = 3
      [[languages.fr.menu.main]]
        name = "Contact"
        pageRef = "/contact"
        weight = 4

  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    title = "Ahmed Tchagnaou"
    weight = 2
    [languages.en.params]
      description = "Data & AI Engineer: nearly 5 years of production data engineering (Spark, Scala, data lake) and generative AI (evaluated RAG, LLM agents, containerized APIs)."
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "About"
        pageRef = "/about"
        weight = 1
      [[languages.en.menu.main]]
        name = "Experience"
        pageRef = "/experience"
        weight = 2
      [[languages.en.menu.main]]
        name = "Projects"
        pageRef = "/projects"
        weight = 3
      [[languages.en.menu.main]]
        name = "Contact"
        pageRef = "/contact"
        weight = 4

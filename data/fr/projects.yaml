projects:
  - title: "Générateur de données synthétiques hybride"
    description: "MVP interne réalisé chez CGI : génération de jeux de données de test réalistes sans exposer de données de production. Faker assure la structure, les volumes et la cohérence des types ; un LLM enrichit les champs nécessitant du réalisme sémantique (textes libres, libellés, cohérence entre champs)."
    tech: "Python, Faker, LLM"
    image: "/images/projects/synthetic_data_workflow.png"

  - title: "Daxmod"
    description: "Bibliothèque Python développée dans le cadre d'une recherche universitaire sur la classification de texte. Fournit une interface unifiée pour l'entraînement et l'évaluation de modèles de classification (ML classique et deep learning)."
    tech: "Python, Scikit-Learn, TensorFlow"
    image: "/images/projects/daxmod_workflow.png"
    link: "https://github.com/Authentic10/daxmod"
